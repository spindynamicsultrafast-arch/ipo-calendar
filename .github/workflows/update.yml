name: update
on:
  schedule:
    - cron: "47 11 * * *"  # 매일 20:47 KST 한 번 (정각은 GitHub 이 몰려 몇 시간 밀림): 낮에 나온 결과를 다음 날 07:30 카톡 전에 받아 둠 (밀려도 새벽엔 끝남)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: pages
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tests/test_parse.py
      - run: python collect.py
      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calendar.html
          git diff --cached --quiet || (git commit -m "update $(date +%F)" && git push)
      - name: 페이지 만들기
        run: |
          mkdir -p _site
          { echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'; cat calendar.html; } > _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
